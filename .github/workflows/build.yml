name: NanoPi R3S 固件编译

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nanopi-r3s
  cancel-in-progress: false

jobs:
  build:
    name: 编译 ImmortalWrt R3S
    runs-on: ubuntu-26.04-arm

    env:
      TZ: Asia/Shanghai
      FORCE_UNSAFE_CONFIGURE: 1
      CCACHE_DISABLE: 1   # 后续如需缓存可改为0并配置ccache

    steps:

      - name: 检出当前仓库
        uses: actions/checkout@v5

      - name: 释放磁盘空间
        shell: bash
        run: |
          set -eux
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/powershell
          sudo apt-get clean
          docker system prune -af || true
          rm -rf ~/.cache ~/.ccache
          df -h

      - name: 拉取 ImmortalWrt Master
        shell: bash
        run: |
          set -eux
          git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git source

      - name: 安装编译依赖
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            flex gawk gettext git gnutls-dev gperf haveged help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
            libyaml-dev libz-dev llvm lld lrzsz nano ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-docutils python3-pip python3-ply \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt-get clean

      - name: 更新 Feeds
        working-directory: source
        shell: bash
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 注入配置（安全方式）
        shell: bash
        run: |
          set -eux
          # 复制 diffconfig 到 source/.config
          cp configs/diffconfig source/.config
          cd source
          make defconfig

          # 将自定义内核配置追加到 target/linux/rockchip/armv8/config-default
          # （如果不存在则创建）
          KERNEL_CFG_DIR="target/linux/rockchip/armv8"
          mkdir -p "$KERNEL_CFG_DIR"
          CUSTOM_CFG="../configs/config-6.18"
          if [ -f "$CUSTOM_CFG" ]; then
            # 将自定义配置追加到 config-default（避免覆盖）
            cat "$CUSTOM_CFG" >> "$KERNEL_CFG_DIR/config-default"
            echo "已追加自定义内核配置到 $KERNEL_CFG_DIR/config-default"
          else
            echo "警告: configs/config-6.18 不存在，跳过内核配置追加"
          fi

          # 重新生成配置以应用内核变更
          make defconfig

      - name: 下载源码（含失败重试）
        working-directory: source
        shell: bash
        run: |
          set -eux
          make download -j$(nproc) || { find dl -size -1024c -delete && make download -j$(nproc); }

      - name: 显示编译信息
        working-directory: source
        shell: bash
        run: |
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h)"
          echo "Disk: $(df -h)"

      - name: 编译工具链（单独步骤）
        working-directory: source
        shell: bash
        run: |
          set -eux
          # 先编译工具链
          make toolchain/install V=s 2>&1 | tee toolchain-build.log
          # 验证工具链是否生成
          if [ ! -d staging_dir/toolchain-* ]; then
            echo "错误: 工具链编译失败，未生成 staging_dir/toolchain-*"
            exit 1
          fi
          echo "工具链编译成功"

      - name: 上传工具链日志（若失败）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-build-log
          path: source/toolchain-build.log

      - name: 编译固件（自动回退详细模式）
        working-directory: source
        shell: bash
        run: |
          set -eux
          # 首次并行编译
          if make -j$(nproc) V=s 2>&1 | tee firmware-build.log; then
            echo "编译成功"
          else
            echo "并行编译失败，回退至单线程详细日志模式..."
            # 回退单线程，输出完整错误
            make -j1 V=s 2>&1 | tee -a firmware-build.log
            exit 1
          fi

      - name: 上传固件编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-log
          path: source/firmware-build.log

      - name: 整理固件
        if: success()
        shell: bash
        run: |
          set -eux
          mkdir -p release
          cp source/.config release/build.config
          find source/bin/targets/rockchip/armv8 \
            -type f \( -name "*nanopi-r3s*" -o -name "*.buildinfo" -o -name "*.json" -o -name "sha256sums" \) \
            -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-r3s
          path: release

      - name: 上传失败日志（若整体失败）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            source/.config
            source/bin
            source/tmp
            source/logs
            source/firmware-build.log
            source/toolchain-build.log

      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r3s-${{ github.run_number }}
          name: ImmortalWrt Master NanoPi R3S Build-${{ github.run_number }}
          files: release/*
          body: |
            ### 编译信息
            - Target: rockchip/armv8
            - Device: NanoPi R3S
            - Source: ImmortalWrt Master
            - Runner: ubuntu-26.04-arm
            - Workflow: GitHub Actions
            ### 配置来源
            - configs/diffconfig
            - configs/config-6.18（已追加至内核默认配置）

name: 构建 OpenWrt 固件

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '⚠️ 请确认是否开始构建（输入 yes 以继续）'
        required: true
        default: 'no'

env:
  BUILD_DIR: /home/build
  TOOLCHAIN_DIR: /home/build/tools
  OPENWRT_DIR: /home/build/op
  DIFFCONFIG: diffconfig   # 需放在仓库根目录

jobs:
    runs-on: ubuntu-26.04
    # 可选：添加环境审批（需在仓库 Settings/Environments 中预先配置 build 环境并设置审核者）
    # environment:
    #   name: build
    steps:
      - name: 检查确认输入
        if: github.event.inputs.confirm != 'yes'
        run: |
          echo "❌ 未输入 'yes'，构建已取消"
          exit 1

      - name: 清理磁盘空间（预留足够空间编译 OpenWrt）
        run: |
          echo "== 清理前磁盘使用情况 =="
          df -h
          # 移除 Docker 镜像（若存在）
          sudo docker system prune -af || true
          # 清理 apt 缓存
          sudo apt clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          echo "== 清理后磁盘使用情况 =="
          df -h

      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装系统依赖（含 xh via snap）
        run: |
          sudo apt update
          sudo apt install -y \
            bzip2 g++ gawk gcc git glibc-source libncurses-dev make \
            wget unzip xh 
          xh --version

      - name: 创建工作目录
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          mkdir -p ${{ env.TOOLCHAIN_DIR }}
          mkdir -p ${{ env.OPENWRT_DIR }}

      - name: 下载并解压官方工具链（使用 xh）
        run: |
          TOOLCHAIN_URL="https://downloads.openwrt.org/snapshots/targets/rockchip/armv8/openwrt-toolchain-rockchip-armv8_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          xh -d "$TOOLCHAIN_URL" -o /tmp/toolchain.tar.zst
          tar -xf /tmp/toolchain.tar.zst -C ${{ env.BUILD_DIR }}
          mv ${{ env.BUILD_DIR }}/openwrt-toolchain-* ${{ env.TOOLCHAIN_DIR }}
          rm -f /tmp/toolchain.tar.zst

      - name: 克隆 OpenWrt 主线源码
        run: |
          git clone -b main --single-branch --depth=1 \
            https://github.com/openwrt/openwrt.git ${{ env.OPENWRT_DIR }}

      - name: 复制 diffconfig 配置文件
        run: |
          cp ${{ github.workspace }}/${{ env.DIFFCONFIG }} ${{ env.OPENWRT_DIR }}/

      - name: 配置外部工具链
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          cat diffconfig > .config
          ./scripts/ext-toolchain.sh --toolchain ${{ env.TOOLCHAIN_DIR }} --config rockchip/armv8

      - name: 替换为 ImmortalWrt 的 feeds 配置
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          rm -f feeds.conf.default
          xh  -d https://github.com/immortalwrt/immortalwrt/raw/refs/heads/master/feeds.conf.default

      - name: 更新并安装 feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行 defconfig
        working-directory: ${{ env.OPENWRT_DIR }}
        run: make defconfig

      - name: 下载所有源码包
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          make download -j8 V=s
        env:
          FORCE_UNSAFE_CONFIGURE: 1

      - name: 编译固件
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          make -j$(nproc) V=s 2>&1
        env:
          FORCE_UNSAFE_CONFIGURE: 1

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-rockchip-armv8-固件
          path: |
            ${{ env.OPENWRT_DIR }}/bin/targets/rockchip/armv8/*.img.gz
            ${{ env.OPENWRT_DIR }}/bin/targets/rockchip/armv8/*.tar.gz
          retention-days: 7
          if-no-files-found: error

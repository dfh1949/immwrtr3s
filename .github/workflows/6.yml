name: 构建 OpenWrt 固件

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '⚠️ 请确认是否开始构建（输入 yes 以继续）'
        required: true
        default: 'no'
  watch:
    types: [started]

env:
  OPENWRT_DIR: /home/runner/build/op
  DIFFCONFIG: diffconfig

jobs:
  build:
    name: 编译
    runs-on: ubuntu-26.04
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'watch' && github.actor == github.repository_owner) }}

    steps:
      - name: 检查确认输入（仅手动触发时需要）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'yes'
        run: |
          echo "❌ 未输入 'yes'，构建已取消"
          exit 1

      - name: 显示触发信息
        run: |
          echo "🚀 构建触发方式: ${{ github.event_name }}"
          echo "📌 仓库: ${{ github.repository }}"
          echo "👤 触发者: ${{ github.actor }}"
          echo "⏰ 触发时间: $(date)"

      - name: 清理磁盘空间 (最大化)
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          rm_cmd: "rmz"
          rmz_version: "3.2.0"
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-* mono* ghc* cabal* php* ruby* *openjdk* ant* maven* gradle* docker* containerd* podman* buildah* skopeo*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/share/dotnet /usr/share/java /usr/share/rust /usr/local/go /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/racket /usr/local/share/boost"
          testing: false

      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev axel bat
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: 下载并解压官方工具链
        run: |
          axel -n 4 -o /tmp/tool.tar.zst https://downloads.immortalwrt.org/snapshots/targets/rockchip/armv8/immortalwrt-toolchain-rockchip-armv8_gcc-14.4.0_musl.Linux-x86_64.tar.zst
          axel -n 4 -o /tmp/ll.tar.zst https://downloads.immortalwrt.org/snapshots/targets/rockchip/armv8/llvm-bpf-22.1.3.Linux-x86_64.tar.zst
          mkdir /tmp/tool  /home/runner/build /home/runner/build/tools /home/runner/build/llvm
          tar -xf /tmp/ll.tar.zst -C /home/runner/build/llvm
          tar -xf /tmp/tool.tar.zst --strip-components=1 -C /tmp/tool
          mv /tmp/tool/toolchain-*/  /home/runner/build/tools
          rm -rf /tmp/ll.tar.zst /tmp/tool.tar.zst /tmp/tool

      - name: 克隆 OpenWrt 主线源码
        run: |
          git clone -b master --single-branch --depth=1 https://github.com/immortalwrt/immortalwrt.git /home/runner/build/op
          
      - name: 下载 ImmortalWrt feeds 配置并更新 feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
      - name: 复制config
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          batcat ${{ github.workspace }}/kconfig > ${{ env.OPENWRT_DIR }}/target/linux/rockchip/armv8/config-6.18
          batcat ${{ github.workspace }}/gconfig > ${{ env.OPENWRT_DIR }}/target/linux/generic/config-6.18
          batcat ${{ github.workspace }}/diffconfig > ${{ env.OPENWRT_DIR }}/.config
          ./scripts/ext-toolchain.sh --toolchain /home/runner/build/tools/toolchain-*/ --overwrite-config --config rockchip/armv8
          make defconfig

      - name: 下载所有源码包
        working-directory: ${{ env.OPENWRT_DIR }}
        run: make download -j4 V=s
        env:
          FORCE_UNSAFE_CONFIGURE: 1

      - name: 编译固件
        working-directory: ${{ env.OPENWRT_DIR }}
        run: make -j$(nproc) V=s
        env:
          FORCE_UNSAFE_CONFIGURE: 1

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrtwrt-rockchip-armv8-firmware
          path: |
            ${{ env.OPENWRT_DIR }}/bin/targets/rockchip/armv8/*.img.gz
            ${{ env.OPENWRT_DIR }}/bin/targets/rockchip/armv8/*.buildinfo
          retention-days: 7
          if-no-files-found: error

      - name: 构建成功通知（仅 Star 触发时）
        if: github.event_name == 'watch' && success()
        run: |
          echo "✅ 构建成功！由 Star 触发"
          echo "⭐ 感谢 ${{ github.actor }} 的 Star！"

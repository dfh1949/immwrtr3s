name: 构建 OpenWrt 固件

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '⚠️ 请确认是否开始构建（输入 yes 以继续）'
        required: true
        default: 'no'
      ssh_debug:
        description: '🔧 是否开启 SSH 调试（输入 yes 开启）'
        required: false
        default: 'no'
  watch:
    types: [started]

env:
  OPENWRT_DIR: /home/runner/build/op
  DIFFCONFIG: diffconfig

jobs:
  build:
    name: 编译
    runs-on: ubuntu-26.04
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'watch' && github.actor == github.repository_owner) }}

    steps:
      - name: 检查确认输入（仅手动触发时需要）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'yes'
        run: |
          echo "❌ 未输入 'yes'，构建已取消"
          exit 1

      - name: 显示触发信息
        run: |
          echo "🚀 构建触发方式: ${{ github.event_name }}"
          echo "📌 仓库: ${{ github.repository }}"
          echo "👤 触发者: ${{ github.actor }}"
          echo "⏰ 触发时间: $(date)"

      - name: 清理磁盘空间
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true
          tools-cache: true

      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget dwarves llvm python3-pyelftools \
            libpython3-dev aria2 jq qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev \
            libmpc-dev libfuse-dev axel
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: 下载并解压官方工具链
        run: |
          mkdir -p /home/runner/build/{tools,llvm}
          axel -n 8 -o /tmp/tool.tar.zst \
            https://downloads.immortalwrt.org/snapshots/targets/rockchip/armv8/immortalwrt-toolchain-rockchip-armv8_gcc-14.4.0_musl.Linux-x86_64.tar.zst
          axel -n 8 -o /tmp/ll.tar.zst \
            https://downloads.immortalwrt.org/snapshots/targets/rockchip/armv8/llvm-bpf-22.1.3.Linux-x86_64.tar.zst
          tar --zstd -xf /tmp/ll.tar.zst --strip-components=1 -C /home/runner/build/llvm 
          tar --zstd -xf /tmp/tool.tar.zst --strip-components=2 -C /home/runner/build/tools --wildcards '*/toolchain-*'
          rm -rf /tmp/*.tar.zst 

      - name: 克隆 OpenWrt 主线源码
        run: |
          git clone -b master --single-branch --depth=1 --filter=blob:none \
            https://github.com/immortalwrt/immortalwrt.git ${{ env.OPENWRT_DIR }}

      - name: 更新并安装 feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 复制配置并生成完整配置
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          cp ${{ github.workspace }}/kconfig ${{ env.OPENWRT_DIR }}/target/linux/rockchip/armv8/config-6.18
          cp ${{ github.workspace }}/diffconfig ${{ env.OPENWRT_DIR }}/.config
          ./scripts/ext-toolchain.sh \
            --toolchain /home/runner/build/tools/ \
            --overwrite-config \
            --config rockchip/armv8
          make defconfig

      - name: 下载所有源码包
        working-directory: ${{ env.OPENWRT_DIR }}
        run: make download -j$(nproc) V=s
        env:
          FORCE_UNSAFE_CONFIGURE: 1

      - name: 编译固件
        working-directory: ${{ env.OPENWRT_DIR }}
        run: make -j$(nproc) V=s
        env:
          FORCE_UNSAFE_CONFIGURE: 1

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rockchip-armv8-firmware
          path: |
            ${{ env.OPENWRT_DIR }}/bin/targets/rockchip/armv8/*.img.gz
            ${{ env.OPENWRT_DIR }}/bin/targets/rockchip/armv8/*.buildinfo
          retention-days: 7
          if-no-files-found: error

      - name: 构建成功通知
        if: success()
        run: |
          echo "✅ 构建成功！"
          if [ "${{ github.event_name }}" == "watch" ]; then
            echo "⭐ 感谢 ${{ github.actor }} 的 Star！"
          fi

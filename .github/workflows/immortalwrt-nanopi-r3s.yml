name: "ImmortalWrt · NanoPi R3S 固件编译"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: immortalwrt-nanopi-r3s
  cancel-in-progress: false

jobs:
  build:
    name: "编译 NanoPi R3S"
    runs-on: ubuntu-26.04-arm

    env:
      TZ: Asia/Shanghai
      FORCE_UNSAFE_CONFIGURE: 1
      CCACHE_DISABLE: 1

    steps:
      - name: "释放磁盘空间"
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== 编译前磁盘 ==="
          df -h

          # GitHub-hosted runner 预装的大型无关组件
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache

          # 清理 APT、Docker 与普通用户缓存
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo docker system prune -af || true

          rm -rf \
            "${HOME}/.cache" \
            "${HOME}/.ccache" \
            "${RUNNER_TEMP}/"*

          echo "=== 编译后磁盘 ==="
          df -h

      - name: "检出 ImmortalWrt master"
        uses: actions/checkout@v5
        with:
          repository: immortalwrt/immortalwrt
          ref: master
          fetch-depth: 1
          submodules: recursive

      - name: "同步本地编译配置"
        shell: bash
        run: |
          set -euxo pipefail

          test -f "${GITHUB_WORKSPACE}/configs/nanopi-r3s.diffconfig"
          test -f "${GITHUB_WORKSPACE}/configs/nanopi-r3s-kernel.config"

          # 常规 ImmortalWrt/Kconfig 配置
          cp \
            "${GITHUB_WORKSPACE}/configs/nanopi-r3s.diffconfig" \
            "${GITHUB_WORKSPACE}/.config"

          # Kernel Kconfig fragment
          mkdir -p "${GITHUB_WORKSPACE}/env"
          cp \
            "${GITHUB_WORKSPACE}/configs/nanopi-r3s-kernel.config" \
            "${GITHUB_WORKSPACE}/env/kernel-config"

          # 明确关闭 ccache，避免已有配置重新启用缓存
          {
            echo
            echo "# GitHub Actions: no cache"
            echo "# CONFIG_CCACHE is not set"
          } >> "${GITHUB_WORKSPACE}/.config"

          echo "=== 注入后的 diffconfig ==="
          sed -n '1,240p' "${GITHUB_WORKSPACE}/.config"

          echo "=== 注入后的 kernel config ==="
          sed -n '1,240p' "${GITHUB_WORKSPACE}/env/kernel-config"

      - name: "安装编译依赖"
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gettext \
            gcc \
            g++ \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            lrzsz \
            mkisofs \
            patch \
            pkgconf \
            python3 \
            python3-distutils \
            python3-pip \
            qemu-utils \
            rsync \
            swig \
            unzip \
            uuid-dev \
            wget \
            xsltproc \
            zlib1g-dev

          # 彻底避免 apt 自己留下大量缓存
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: "确认目标配置"
        shell: bash
        run: |
          set -euxo pipefail

          make defconfig

          echo "=== Target ==="
          grep -E \
            '^(CONFIG_TARGET_rockchip|CONFIG_TARGET_.*DEVICE_friendlyarm_nanopi-r3s|CONFIG_LINUX_|CONFIG_CCACHE)' \
            .config || true

          echo "=== NanoPi R3S target ==="
          grep -q '^CONFIG_TARGET_rockchip=y$' .config
          grep -q '^CONFIG_TARGET_rockchip_armv8=y$' .config
          grep -q '^CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r3s=y$' .config

          # 如果 diffconfig 中写入了 ccache，则直接失败
          if grep -qE '^CONFIG_CCACHE=y|^CONFIG_CCACHE=m' .config; then
            echo "ERROR: ccache is enabled"
            exit 1
          fi

      - name: "清理构建前缓存"
        shell: bash
        run: |
          set -euxo pipefail

          # 不使用 Actions cache，也不使用 ccache
          rm -rf \
            "${HOME}/.ccache" \
            ".ccache" \
            "tmp/cache"

          mkdir -p dl

          echo "=== 磁盘状态 ==="
          df -h

      - name: "编译 NanoPi R3S"
        shell: bash
        run: |
          set -euxo pipefail

          export CCACHE_DISABLE=1

          # 不保留旧目标输出，确保本次构建从头生成
          rm -rf bin/targets/rockchip/armv8

          make -j"$(nproc)" V=s

      - name: "整理固件"
        shell: bash
        run: |
          set -euxo pipefail

          OUT="bin/targets/rockchip/armv8"
          RELEASE_DIR="${RUNNER_TEMP}/release"

          mkdir -p "${RELEASE_DIR}"

          # R3S 本身的固件
          find "${OUT}" -maxdepth 1 -type f \
            \( -name '*friendlyarm_nanopi-r3s*' -o -name '*nanopi-r3s*' \) \
            -print0 |
            xargs -0 -r cp -t "${RELEASE_DIR}"

          # 同时带上构建信息，方便之后追溯
          for file in \
            "${OUT}/config.buildinfo" \
            "${OUT}/version.buildinfo" \
            "${OUT}/feeds.buildinfo" \
            "${OUT}/profiles.json"
          do
            if [ -f "$file" ]; then
              cp "$file" "${RELEASE_DIR}/"
            fi
          done

          # 打包本次真正使用过的配置
          cp .config "${RELEASE_DIR}/nanopi-r3s.build.config"
          cp env/kernel-config "${RELEASE_DIR}/nanopi-r3s.kernel.config"

          # 生成 SHA256
          (
            cd "${RELEASE_DIR}"
            sha256sum * > SHA256SUMS
          )

          echo "RELEASE_DIR=${RELEASE_DIR}" >> "${GITHUB_ENV}"

          echo "=== Release 文件 ==="
          find "${RELEASE_DIR}" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: "上传构建产物"
        uses: actions/upload-artifact@v4
        with:
          name: "immortalwrt-nanopi-r3s"
          path: "${{ env.RELEASE_DIR }}"
          if-no-files-found: error
          retention-days: 7

      - name: "发布至 Releases"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          DATE_UTC="$(date -u +'%Y%m%d-%H%M')"
          TAG="nanopi-r3s-${DATE_UTC}-${SHORT_SHA}"
          TITLE="ImmortalWrt master · NanoPi R3S · ${DATE_UTC}"

          cat > "${RELEASE_DIR}/RELEASE.md" <<EOF
          # ImmortalWrt NanoPi R3S

          - Branch: \`master\`
          - Commit: \`${GITHUB_SHA}\`
          - Runner: \`ubuntu-26.04-arm\`
          - Target: \`rockchip/armv8\`
          - Device: \`friendlyarm_nanopi-r3s\`
          - Build time (UTC): \`${DATE_UTC}\`

          本次构建使用仓库内：
          - \`configs/nanopi-r3s.diffconfig\`
          - \`configs/nanopi-r3s-kernel.config\`
          EOF

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TITLE}" \
            --notes-file "${RELEASE_DIR}/RELEASE.md" \
            "${RELEASE_DIR}"/*
